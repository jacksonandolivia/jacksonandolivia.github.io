<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackson & Olivia | Wedding</title>
  <meta property="og:title" content="Jackson & Olivia | Wedding">
  <meta property="og:description" content="Join us in Ames, Iowa on November 7, 2026.">
  <meta property="og:image" content="https://jacksonandolivia.github.io/images/jando_gnome_web.jpeg">
  <meta property="og:url" content="https://jacksonandolivia.github.io/">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: "Spectral", serif;
      background: #F1E9D2;
      color: black;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      max-width: 56rem;
      width: 100%;
      padding: 2rem 1rem 3rem;
    }
    .hero {
      width: 100%;
      text-align: center;
      padding: 1rem;
    }
    .photo-details {
      margin-top: 1.2rem;
      text-align: center;
    }
    .hero-photo {
      width: 100%;
      max-width: 48rem;
      max-height: 32rem;
      object-fit: contain;
      object-position: center;
      border-radius: 0.2rem;
      margin: 0 auto 1.6rem;
      display: block;
    }
    .hero h1 {
      font-family: "Pinyon Script", cursive;
      font-size: 3.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }
    .hero h1 a {
      color: inherit;
      text-decoration: none;
    }
    .hero-date {
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .event-meta {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 38rem;
      margin: 0 auto;
      gap: 1rem;
      font-size: 1.55rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .event-meta p {
      margin: 0;
      line-height: 1.25;
    }
    .event-meta .left {
      text-align: right;
    }
    .event-meta .right {
      text-align: left;
    }
    .event-divider {
      width: 1px;
      height: 5.4rem;
      background: #8a8a8a;
    }
    .countdown {
      font-size: 0.95rem;
      margin-top: 0.45rem;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .rsvp-cta {
      display: flex;
      justify-content: center;
      margin-top: 1rem;
    }
    .rsvp-cta a {
      text-decoration: none;
      color: #fff;
      background: #1f1b24;
      padding: 0.42rem 1rem;
      border-radius: 0.1rem;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .rsvp-cta a:hover,
    .rsvp-cta a:focus-visible {
      background: #0f0c12;
    }
    .navbar {
      margin: 1rem 0 1.5rem;
      border-top: 1px solid #6b7687;
      border-bottom: 1px solid #6b7687;
      padding: 0.65rem 0;
    }
    .navbar ul {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem 1.4rem;
    }
    .navbar a {
      color: inherit;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      text-underline-offset: 0.2rem;
    }
    .navbar a:hover,
    .navbar a:focus-visible {
      text-decoration: underline;
    }
    .wedding-day {
      margin-top: 1.7rem;
      text-align: center;
    }
    .wedding-day h2 {
      font-size: 2rem;
      letter-spacing: 0.08em;
      margin-bottom: 0.3rem;
      text-transform: uppercase;
    }
    .wedding-day p {
      font-size: 1rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    @media (max-width: 680px) {
      .event-meta {
        grid-template-columns: 1fr;
        gap: 0.45rem;
        font-size: 1.2rem;
      }
      .event-meta .left,
      .event-meta .right {
        text-align: center;
      }
      .event-divider {
        width: 4rem;
        height: 1px;
        justify-self: center;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1><a href="/">Jackson &amp; Olivia</a></h1>
      <p class="hero-date">SATURDAY, NOVEMBER 7TH, 2026 • AMES, IOWA</p>
      <p class="countdown" id="countdown-text"></p>
    </div>
    <nav class="navbar" aria-label="Wedding menu">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/schedule/">Schedule</a></li>
        <li><a href="/accommodations/">Accommodations</a></li>
        <li><a href="/registry/">Registry</a></li>
        <li><a href="/things-to-do-in-ames/">Things to do in Ames</a></li>
        <li><a href="/RSVP/">RSVP</a></li>
      </ul>
    </nav>
    <section class="photo-details" aria-label="Wedding photo and details">
      <img class="hero-photo" src="/images/jando_gnome_web.jpeg" alt="Jackson and Olivia photo">
      <div class="event-meta" aria-label="Wedding date and location">
        <p class="left">NOVEMBER<br>7, 2026</p>
        <span class="event-divider" aria-hidden="true"></span>
        <p class="right">AMES<br>IOWA</p>
      </div>
      <p class="rsvp-cta"><a href="/RSVP/">RSVP</a></p>
    </section>
  </div>
  <script>
    (function () {
      var countdownEl = document.getElementById('countdown-text');
      var eventDate = new Date('2026-11-07T00:00:00');
      var now = new Date();
      var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      var targetDay = new Date(eventDate.getFullYear(), eventDate.getMonth(), eventDate.getDate());
      var millisecondsPerDay = 1000 * 60 * 60 * 24;
      var daysRemaining = Math.ceil((targetDay - today) / millisecondsPerDay);

      if (daysRemaining > 0) {
        countdownEl.textContent = daysRemaining + ' DAYS TO GO!';
      } else if (daysRemaining === 0) {
        countdownEl.textContent = 'TODAY IS THE BIG DAY!';
      } else {
        countdownEl.textContent = 'WE SAID "I DO"!';
      }
    })();
  </script>
</body>
</html>
